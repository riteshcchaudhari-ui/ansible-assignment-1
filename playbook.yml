---
- name: Deploy Flask App with Docker Compose
  hosts: servers
  become: true

  vars:
    repo_url: "https://github.com/LondheShubham153/flask-app-ecs.git"
    app_dir: "/opt/flask-app"
    app_port: 80
    container_port: 80
    compose_project_name: "flask-app"

  tasks:
    - name: Update apt cache (Debian family)
      apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install base packages
      package:
        name:
          - git
          - curl
          - ca-certificates
        state: present

    - name: Install Docker (Debian/Ubuntu)
      shell: |
        set -e
        curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Docker (RedHat family)
      shell: |
        set -e
        curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Docker Compose plugin
      shell: |
        set -e
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
          -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Clone the Flask app repository (shallow)
      shell: |
        set -e
        if [ -d {{ app_dir }}/.git ]; then
          cd {{ app_dir }}
          git fetch --depth=1 origin main
          git reset --hard origin/main
        else
          rm -rf {{ app_dir }}
          git clone --depth=1 --branch main {{ repo_url }} {{ app_dir }}
        fi
      args:
        creates: "{{ app_dir }}/.git"
      environment:
        GIT_TERMINAL_PROMPT: "0"

    - name: Create docker-compose.yml if missing
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            app:
              build: .
              container_name: {{ compose_project_name }}
              restart: unless-stopped
              ports:
                - "{{ app_port }}:{{ container_port }}"
      when: not (app_dir + '/docker-compose.yml') is exists

    - name: Tear down existing stack
      command: docker compose -p {{ compose_project_name }} down --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      failed_when: false
      changed_when: false

    - name: Build and start the app
      command: docker compose -p {{ compose_project_name }} up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for port to open
      wait_for:
        port: "{{ app_port }}"
        delay: 5
        timeout: 60

    - name: Verify HTTP 200
      uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
